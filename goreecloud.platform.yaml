schema_version: "0.2"

component:
  type: service
  id: goreecloud-router-os
  product_name: GoreeCloud Router OS
  repository: GoreeCloud/goreecloud-router-os

lifecycle: development
version: "0.0.1-m0"

supported_platforms:
  - linux-x86_64-virtual-development

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: GoreeCloud Manager registration, administrative integration, and runtime acceptance are not established.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - PRIVACY POLICY.md
      - SECURITY.md
      - prototype/routeros_m0/journal.py
      - prototype/routeros_m0/recovery.py
      - tests/test_routeros_m0.py
    notes: The prototype is local-only and privacy-minimized. The Milestone 0 journal refuses defined sensitive fields and preserves ambiguous recovery evidence locally, but accepted Privacy Shield authorization, data-classification coverage, retention policy, and runtime privacy evidence are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
      - prototype/routeros_m0/journal.py
      - prototype/routeros_m0/recovery.py
      - tests/test_routeros_m0.py
    notes: Prototype validation, rollback, journal-integrity checks, and fail-closed third-state recovery behavior exist, but accepted Wardveil Security integration and production protection evidence are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - prototype/routeros_m0/transaction.py
      - prototype/routeros_m0/journal.py
      - prototype/routeros_m0/recovery.py
      - tests/test_routeros_m0.py
    notes: An atomic local journal and exact-state interrupted-transaction reconciliation are implemented only as a Milestone 0 proof. This is not Everkeep integration; durable protected snapshots, secret-safe restore, migration, power-loss acceptance, and Everkeep recovery acceptance are not established.
  glaze_ui:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: GLAZE UI V1.3 / 1.3.0 is the current required Stable consumer target for the specified administration surface, but no accepted Router OS UI implementation or rendered/accessibility evidence exists in this repository.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: GoreeCloud Mesh registration, capability publication, and runtime acceptance are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: A local authenticated management API is planned, but accepted GoreeCloud Identity integration is not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define durable Router OS configuration snapshot scope and retention under Everkeep and Privacy Shield authority.
      - Preserve the previous known-good configuration before high-risk apply operations.
      - Keep production secrets outside ordinary journal/export material unless an approved protected format explicitly authorizes them.
  restore:
    required: true
    requirements:
      - Validate configuration compatibility and schema before restore.
      - Verify runtime state after restore and fail closed when verification cannot prove success.
      - Preserve recovery evidence when observed state is neither the exact desired nor previous accepted revision.
  export:
    required: true
    requirements:
      - Define a versioned, secret-safe configuration export format before user-facing export is implemented.
  portability:
    required: true
    requirements:
      - Define hardware/interface remapping and compatibility rules before cross-device restore is claimed.

external_dependencies:
  - name: Linux networking stack
    purpose: Future kernel routing, filtering, interfaces, and traffic-control primitives.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.3.0"
  requires:
    - goreecloud-platform-contract==0.2
    - goreecloud-glaze-ui==1.3.0
  provides:
    - goreecloud-router-os-config/0.1-prototype

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - SECURITY.md
    - PRIVACY POLICY.md
    - prototype/routeros_m0/validator.py
    - prototype/routeros_m0/compiler.py
    - prototype/routeros_m0/transaction.py
    - prototype/routeros_m0/journal.py
    - prototype/routeros_m0/recovery.py
    - tests/test_routeros_m0.py
  blockers:
    - Reference Build 0.1 privileged Linux networking backends are not implemented or accepted.
    - Local authenticated management API is not implemented or accepted.
    - Glaze UI administration surface is not implemented or accepted.
    - Privacy Shield integration and runtime acceptance are not established.
    - Wardveil Security integration and runtime acceptance are not established.
    - Everkeep durable recovery integration and acceptance are not established; the local Milestone 0 journal is only a development proof.
    - GoreeCloud Mesh, Manager, and Identity platform integration acceptance are not established.
    - Virtual-machine routing, firewall, NAT, DHCP, rollback, recovery, and management-safety acceptance is outstanding.
    - Production signing, update, release, hardware qualification, and deployment acceptance are outstanding.
