name: Validate Milestone 0

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate reference configuration
        run: python scripts/validate_config.py config/examples/reference-build-0.1.json --check-only
      - name: Reference Build 0.1 virtual network lab
        run: sudo "$(command -v python)" lab/reference_build_0_1.py --run
